server {
    listen ${PORT};
    server_name _;

    # ใส่ DNS Resolver เพื่อให้ Nginx ค้นหา URL สาธารณะจากภายใน Container ได้
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    location / {
        # 1. URL สาธารณะของฝั่ง PHP
        proxy_pass https://terrific-perception-production-1653.up.railway.app;

        # 2. ตั้งค่า Host และเปิด SSL
        proxy_set_header Host terrific-perception-production-1653.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_name terrific-perception-production-1653.up.railway.app;
        
        # 3. ส่ง Header บอก PHP ว่ามาทาง Nginx
        proxy_set_header X-Server-Type "NGINX";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
