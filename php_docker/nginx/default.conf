server {
    listen 80;
    server_name localhost;

    location / {
        # เปลี่ยนตรงนี้ให้ใช้ชื่อโฮสต์ภายในของ Railway หรือโดเมนที่ได้มา
        proxy_pass http://php-railway-project-production.up.railway.app:8080;
        
        # หรือถ้าจะใช้ Private Network ภายในของ Railway ให้ใช้รูปแบบนี้:
        # proxy_pass http://<ชื่อ-service-php-ของคุณ>.railway.internal:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
