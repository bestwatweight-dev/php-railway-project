server {
    listen ${PORT};
    server_name _;

    location / {
        # 1. ใส่ URL ฝั่ง PHP
        proxy_pass https://terrific-perception-production-1653.up.railway.app;

        # 2. ตั้งค่า Host ให้ตรงกับฝั่ง PHP และเปิด SSL
        proxy_set_header Host terrific-perception-production-1653.up.railway.app;
        proxy_ssl_server_name on;
        
        proxy_set_header X-Server-Type "NGINX";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
