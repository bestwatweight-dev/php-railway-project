server {
    listen ${PORT};
    server_name _;

    location / {
        # ชี้ proxy_pass ไปยัง Private Domain ของ Service PHP ใน Railway
        # ตัวอย่าง: http://<ชื่อ-SERVICE-PHP>.railway.internal:8080
        proxy_pass http://php-railway-project.railway.internal:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
