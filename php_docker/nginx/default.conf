server {
    listen ${PORT};
    server_name _;

    location / {
        # เปลี่ยนตรงนี้เป็นชื่อ Private Domain จริงๆ ที่ก๊อปปี้มาจาก Railway
        proxy_pass http://php-railway-project.railway.internal:8080;
        
        proxy_set_header X-Server-Type "NGINX";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
