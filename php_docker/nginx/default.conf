server {
    listen ${PORT};
    server_name _;

    location / {
        # เปลี่ยน <PRIVATE_DOMAIN_PHP> เป็นชื่อ Private Domain ของ PHP ใน Railway
        proxy_pass http://<PRIVATE_DOMAIN_PHP>:8080;
        
        proxy_set_header X-Server-Type "NGINX";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
